name: Rust
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - run: ./test.sh
      - run: cargo package --locked
      - run: cargo clean -p airust
  macos-checks:
    # Retain unavailable macOS 26 attempts; use an explicit supported image.
    # Bound compiler parallelism and the job while preserving the full matrix.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
      - run: sysctl -n hw.memsize hw.ncpu
      - run: df -h .
      - run: rustc -vV
      - run: python3 --version
      - run: ./test.sh
      - run: cargo package --locked
      - run: cargo clean -p airust

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - run: cargo check --all-targets --features web,bots,async,colors,plotting,embeddings,hybrid,graph,context-assembly,provenance,cache,hnsw,versioning,quality,reranking,advanced-search,storage,sqlite-storage,retrieval,snapshots,execution,shared-index,adaptive,feedback,learned-ranking,reasoning,quality-gates,evidence-freshness,rank-explanations,training-pipeline,disk-index,documents,mcp,pilot --locked
      - run: cargo clean -p airust
  local-embedding-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - run: cargo check --all-features --all-targets --locked
      - run: cargo clean -p airust

  pdf-backend:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/pdf-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target/pdf-backend
          key: pdf-backend-${{ runner.os }}-${{ hashFiles('crates/airust-pdf-backend/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            pdf-backend-${{ runner.os }}-${{ hashFiles('crates/airust-pdf-backend/Cargo.lock') }}-
      - run: cargo test --manifest-path crates/airust-pdf-backend/Cargo.toml --test regressions --locked
      - run: cargo check --manifest-path crates/airust-pdf-backend/Cargo.toml --features c-api --lib --locked
      - run: python3 scripts/check_pdf_backend.py
      - run: cargo package --manifest-path crates/airust-pdf-backend/Cargo.toml --locked
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo +1.89.0 check --manifest-path crates/airust-pdf-backend/Cargo.toml --lib --locked

  native-worker-linux:
    runs-on: ubuntu-latest
    env:
      ORT_WHEEL: onnxruntime-1.32.0-cp312-cp312-manylinux_2_28_x86_64.whl
      ORT_WHEEL_URL: https://files.pythonhosted.org/packages/a3/81/55845186c20cba59f614991f4065dea148e48eeb9749893768c85ce64327/onnxruntime-1.32.0-cp312-cp312-manylinux_2_28_x86_64.whl
      ORT_WHEEL_SHA256: 99e1074c4b2197accd5073052a465361be17b89c093b8ffb6e6bd8f986c52df8
      ORT_WHEEL_BYTES: "27780211"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/native-assets
          key: native-assets-${{ hashFiles('docs/models/mmarco-minilm-v2.json') }}-${{ env.ORT_WHEEL_SHA256 }}
      - name: Verify pinned model and runtime artifacts
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/native-assets"
          mkdir -p "$assets/model" "$assets/runtime"
          python3 scripts/download_reranker.py "$assets/model"
          wheel="$assets/$ORT_WHEEL"
          if [ ! -f "$wheel" ]; then curl --fail --location --silent --show-error --output "$wheel" "$ORT_WHEEL_URL"; fi
          test "$(stat -c %s "$wheel")" = "$ORT_WHEEL_BYTES"
          echo "$ORT_WHEEL_SHA256  $wheel" | sha256sum --check --strict
          python3 -I -c "import sys,zipfile,pathlib; z=zipfile.ZipFile(sys.argv[1]); names=[n for n in z.namelist() if pathlib.PurePosixPath(n).name.startswith('libonnxruntime.so')]; assert len(names)==1, names; pathlib.Path(sys.argv[2]).write_bytes(z.read(names[0]))" "$wheel" "$assets/runtime/libonnxruntime.so"
          sha256sum "$assets/runtime/libonnxruntime.so" "$assets/model/onnx/model.onnx"
      - run: cargo build --release --locked --features local-reranking --example native_worker_soak
      - name: Shortened worker soak with fault injection
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/native-assets"
          mkdir -p "$RUNNER_TEMP/snapshots"
          target/release/examples/native_worker_soak tests/fixtures/native-lifecycle-v1.json "$assets/model" "$assets/runtime/libonnxruntime.so" 900 "$RUNNER_TEMP/snapshots" | tee "$RUNNER_TEMP/soak.jsonl"
          python3 -B scripts/analyze_worker_soak.py "$RUNNER_TEMP/soak.jsonl" --short
