[package]
edition = "2021"
rust-version = "1.89"
name = "airust-pdf-backend"
version = "0.3.5"
authors = ["LEVOGNE", "Yury Fedoseev and PDFOxide contributors (upstream)"]
build = false
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/UPSTREAM.md", "/upstream.patch", "/UPSTREAM-SHA256.json", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/TRADEMARKS.md", "src/**", "tests/**", "!**/.DS_Store", "!**/._*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Optional AIRust PDF backend with bounded small-object loading; derived from pdf_oxide 0.3.78"
homepage = "https://github.com/LEVOGNE/airust"
documentation = "https://docs.rs/airust"
readme = "README.md"
keywords = [
    "pdf",
    "text-extraction",
    "pdf-parser",
    "pdf-to-markdown",
    "document-parser",
]
categories = [
    "parsing",
    "text-processing",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LEVOGNE/airust"

[features]
c-api = []
barcodes = [
    "dep:qrcode",
    "dep:barcoders",
]
cjk-form-fonts = []
cjk-render-fallback = []
debug-span-merging = []
default = [
    "icc",
    "legacy-crypto",
]
fips = [
    "dep:aws-lc-rs",
    "aws-lc-rs/fips",
]
gpu = [
    "dep:ort",
    "ml",
]
icc = ["icc-qcms"]
icc-lcms2 = ["dep:lcms2"]
icc-qcms = ["dep:qcms"]
jpeg2000 = ["dep:hayro-jpeg2000"]
legacy-crypto = ["dep:md-5"]
logging = []
ml = [
    "ocr-tract",
    "dep:linfa",
    "dep:linfa-clustering",
]
ocr = [
    "dep:ort",
    "dep:ndarray",
    "dep:ureq",
]
ocr-tract = [
    "dep:tract-onnx",
    "dep:ndarray",
]
parallel = ["dep:rayon"]
python = [
    "pyo3",
    "pyo3-log",
    "rendering",
    "parallel",
    "logging",
    "signatures",
    "tsa-client",
    "barcodes",
]
rendering = [
    "dep:tiny-skia",
    "dep:fast_image_resize",
    "system-fonts",
    "dep:hayro-jbig2",
    "jpeg2000",
]
signatures = [
    "dep:x509-parser",
    "dep:cms",
    "dep:rsa",
    "dep:der",
    "dep:spki",
    "dep:pkcs1",
    "dep:pkcs8",
    "dep:p12-keystore",
    "dep:signature",
    "dep:sha1",
    "dep:p256",
    "dep:p384",
]
system-fonts = [
    "dep:fontdb",
    "dep:harfrust",
]
table-ml = [
    "ml",
    "dep:pdfium-render",
]
test-support = []
tsa-client = [
    "signatures",
    "dep:ureq",
]
wasm = [
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:console_log",
    "dep:getrandom_02",
    "dep:serde-wasm-bindgen",
    "logging",
    "signatures",
    "barcodes",
]
wasm-ml = ["wasm-ocr"]
wasm-ocr = [
    "wasm",
    "ocr-tract",
    "dep:getrandom_03",
]

[lib]
name = "airust_pdf_backend"
crate-type = ["rlib"]
test = false
doctest = false
path = "src/lib.rs"

[dependencies.aes]
version = "0.9"

[dependencies.aws-lc-rs]
version = "1"
features = ["fips"]
optional = true

[dependencies.barcoders]
version = "2.0"
features = ["image"]
optional = true

[dependencies.base64]
version = "0.23"

[dependencies.bitflags]
version = "2"

[dependencies.brotli]
version = "9"

[dependencies.byteorder]
version = "1.5"

[dependencies.bytes]
version = "1.12"

[dependencies.cbc]
version = "0.2"

[dependencies.chrono]
version = "0.4"

[dependencies.cms]
version = "0.3.0-pre.1"
optional = true

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[dependencies.console_log]
version = "1"
features = ["color"]
optional = true

[dependencies.der]
version = "0.8"
optional = true

[dependencies.encoding_rs]
version = "0.8"

[dependencies.env_logger]
version = "0.11"

[dependencies.fast_image_resize]
version = "6"
optional = true

[dependencies.fax]
version = "0.3"

[dependencies.flate2]
version = "1.1"
features = ["zlib-rs"]
default-features = false

[dependencies.fontdb]
version = "0.24"
optional = true

[dependencies.getrandom]
version = "0.4"

[dependencies.getrandom_02]
version = "0.2"
features = ["js"]
optional = true
package = "getrandom"

[dependencies.harfrust]
version = "0.13"
optional = true

[dependencies.hayro-jbig2]
version = "0.3"
optional = true
default-features = false

[dependencies.hayro-jpeg2000]
version = "0.4"
optional = true
default-features = false

[dependencies.image]
version = "0.25"
features = [
    "png",
    "jpeg",
    "tiff",
]
default-features = false

[dependencies.jpeg-decoder]
version = "0.3"

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.lcms2]
version = "6"
optional = true

[dependencies.libc]
version = "0.2"

[dependencies.linfa]
version = "0.8"
optional = true

[dependencies.linfa-clustering]
version = "0.8"
optional = true

[dependencies.log]
version = "0.4"

[dependencies.md-5]
version = "0.11"
optional = true

[dependencies.memchr]
version = "2"

[dependencies.ndarray]
version = "0.17"
features = ["std"]
optional = true

[dependencies.nom]
version = "8.0"

[dependencies.office_oxide]
version = "0.1.9"
default-features = false

[dependencies.ort]
version = "=2.0.0-rc.13"
features = [
    "ndarray",
    "load-dynamic",
]
optional = true
default-features = false

[dependencies.p12-keystore]
version = "0.3.1"
optional = true

[dependencies.p256]
version = "0.14"
optional = true

[dependencies.p384]
version = "0.14"
optional = true

[dependencies.pdfium-render]
version = "0.9"
optional = true

[dependencies.phf]
version = "0.14"
features = ["macros"]

[dependencies.pkcs1]
version = "0.8.0-rc.4"
optional = true

[dependencies.pkcs8]
version = "0.11"
optional = true

[dependencies.pyo3]
version = "0.29"
features = [
    "abi3-py38",
    "generate-import-lib",
    "multiple-pymethods",
]
optional = true

[dependencies.pyo3-log]
version = "0.13"
optional = true

[dependencies.qcms]
version = "0.3"
optional = true

[dependencies.qrcode]
version = "0.14"
optional = true

[dependencies.quick-xml]
version = "0.42"

[dependencies.rayon]
version = "1.12"
optional = true

[dependencies.regex]
version = "1.13"

[dependencies.rsa]
version = "0.10.0-rc.18"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde-wasm-bindgen]
version = "0.6"
optional = true

[dependencies.serde_json]
version = "1.0"

[dependencies.sha1]
version = "0.11"
optional = true

[dependencies.sha2]
version = "0.11"

[dependencies.signature]
version = "3.0"
optional = true

[dependencies.smallvec]
version = "1.16"

[dependencies.spki]
version = "0.8"
optional = true

[dependencies.stringprep]
version = "0.1"

[dependencies.subsetter]
version = "0.2"

[dependencies.taffy]
version = "0.14"
features = [
    "std",
    "taffy_tree",
    "block_layout",
    "flexbox",
    "grid",
]
default-features = false

[dependencies.thiserror]
version = "2.0"

[dependencies.tiny-skia]
version = "0.12"
optional = true

[dependencies.tract-onnx]
version = "0.22"
optional = true

[dependencies.ttf-parser]
version = "0.25"

[dependencies.unicode-bidi]
version = "0.3"
default-features = false

[dependencies.unicode-linebreak]
version = "0.1"

[dependencies.unicode-normalization]
version = "0.1"

[dependencies.ureq]
version = "3"
features = ["rustls"]
optional = true
default-features = false

[dependencies.uuid]
version = "1.26"
features = [
    "v4",
    "js",
]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.web-sys]
version = "0.3"
features = ["console"]
optional = true

[dependencies.weezl]
version = "0.2"

[dependencies.x509-parser]
version = "0.18"
optional = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom_03]
version = "0.3"
features = ["wasm_js"]
optional = true
package = "getrandom"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.criterion]
version = "0.8"

[lints.clippy]
collapsible_match = "allow"
doc_overindented_list_items = "allow"
enum_variant_names = "allow"
explicit_counter_loop = "allow"
manual_checked_ops = "allow"
manual_find = "allow"
match_like_matches_macro = "allow"
needless_range_loop = "allow"
redundant_guards = "allow"
regex_creation_in_loops = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"


[workspace]

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.pdf_oxide]
version = "=0.3.78"

[[test]]
name = "regressions"
path = "tests/regressions.rs"
