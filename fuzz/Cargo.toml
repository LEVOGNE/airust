[package]
name = "airust-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
airust = { path = "..", default-features = false }

[features]
default = ["lexical"]
lexical = [
    "airust/retrieval",
    "airust/advanced-search",
    "airust/documents",
    "airust/shared-index",
    "airust/execution",
    "airust/cache",
]
pdf = ["airust/pdf"]

[[bin]]
name = "lexical"
path = "fuzz_targets/lexical.rs"
test = false
doc = false
bench = false
required-features = ["lexical"]

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false
required-features = ["pdf"]

[[bin]]
name = "knowledge"
path = "fuzz_targets/knowledge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_worker"
path = "fuzz_targets/model_worker.rs"
test = false
doc = false
bench = false

[profile.release]
opt-level = 3
debug = 1
lto = false
codegen-units = 16
overflow-checks = true
incremental = false
