  <g id="text_20">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(36 387.955625)">Same native binary, eight cycles each. Default controls failed the frozen 64 MiB post-warm RSS growth budget.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(36 397.557812)">The opt-in startup policy passed (7.6 MB range); vmmap reported 26.5M physical footprint after drop.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(36 407.16)">RSS includes reusable pages. No global environment change, active-model 1 GiB claim or proof of absence of leaks.</text>
  </g>
