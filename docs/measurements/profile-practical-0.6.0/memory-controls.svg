  <g id="text_24">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(33.12 376.831625)">Training controls: 6000 examples, 10 workers per setting/scenario. First writes to shared data copy the collection.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(33.12 386.433813)">Error controls: 128 rejected 2 MiB JSON strings, 3 workers per build. These are generated resource probes.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(33.12 396.036)">Active native models and external services are outside these model-free measurements; no 1-GiB-device certification.</text>
  </g>
