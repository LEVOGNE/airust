[package]
name="airust-overnight-soak"
version="0.0.0"
edition="2021"
publish=false
[features]
shared=["airust/shared-index","previous/shared-index"]
[dependencies]
airust={version="=0.4.4",default-features=false,features=["cache","execution"]}
previous={package="airust",version="=0.4.3",default-features=false,features=["cache","execution"]}
serde_json="1"
sha2="0.10"
postcard={version="1.1.3",default-features=false,features=["use-std"]}
[profile.release]
lto="thin"
codegen-units=1
