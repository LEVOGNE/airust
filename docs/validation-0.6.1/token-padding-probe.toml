[package]
name = "airust-padding-probe"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
[profile.release]
lto = "thin"
codegen-units = 1
