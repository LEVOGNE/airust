[package]
name = "airust-baseline-workspace"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
airust = { version = "=0.5.3", default-features = false, features = ["mcp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
[profile.release]
lto = "thin"
codegen-units = 1
