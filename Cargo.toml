[package]
name = "airust"
version = "0.2.8"
default-run = "airust"
authors = ["LEVOGNE"]
edition = "2021"
rust-version = "1.89"
description = "A modular knowledge intelligence engine: lexical search, text matching, and explainable relation suggestions"
license = "MIT"
readme = "README.md"
keywords = ["search", "bm25", "knowledge", "matching", "retrieval"]
categories = ["text-processing", "algorithms"]
documentation = "https://docs.rs/airust"
homepage = "https://github.com/LEVOGNE/airust"
repository = "https://github.com/LEVOGNE/airust"
include = ["Cargo.toml", "Cargo.lock", "src/**", "build.rs", "knowledge/train.json", "data/pdf/sample.pdf", "examples/**", "scripts/**", "tests/**", "docs/**", "README.md", "STARTUP.md", "CHANGELOG.md", "CONTRIBUTING.md", "ROADMAP.md", "LICENSE", "test.sh", "Dockerfile", ".dockerignore", "!**/.DS_Store", "!**/._*"]
 
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
strsim = "0.10"
chrono = { version = "0.4", optional = true }
thiserror = "1.0"
unicode-normalization = "0.1"
regex = "1.5"
tokio = { version = "1.0", features = ["full"], optional = true }
pdf_oxide = { version = "0.3.78", optional = true }
axum = { version = "0.7", features = ["multipart", "ws"], optional = true }
rusqlite = { version = "0.43", features = ["bundled"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
scraper = { version = "0.29", optional = true }
sha2 = { version = "0.10", optional = true }
url = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
fastembed = { version = "=7.7.1", optional = true, default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic"] }
petgraph = { version = "0.8.3", optional = true, default-features = false, features = ["std", "stable_graph"] }
postcard = { version = "1.1.3", optional = true, default-features = false, features = ["use-std"] }

hnsw_rs = { version = "=0.3.5", optional = true, default-features = false }

[features]
default = []
embeddings = []
hnsw = ["embeddings", "dep:hnsw_rs", "serde/rc"]
hybrid = ["embeddings"]
graph = ["dep:petgraph", "serde/rc"]
context-assembly = ["hybrid", "graph"]
provenance = []
versioning = ["serde/rc"]
quality = []
cache = ["dep:postcard", "dep:sha2"]
local-embeddings = ["embeddings", "dep:fastembed", "dep:ort", "dep:sha2"]
cli = ["embedded-knowledge"]
pdf = ["dep:pdf_oxide"]
embedded-knowledge = []
colors = []
plotting = []
async = ["dep:tokio"]
bots = ["web"]
web = ["cli", "pdf", "dep:chrono", "dep:axum", "dep:tokio", "dep:rusqlite", "dep:reqwest", "dep:scraper", "dep:sha2", "dep:url", "dep:tempfile"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "airust"
path = "src/lib.rs"

[[bin]]
name = "airust"
path = "src/bin/airust.rs"
required-features = ["cli"]


[[bin]]
name = "pdf2kb"
path = "src/bin/pdf2kb.rs"
required-features = ["cli", "pdf"]

[[bin]]
name = "merge_kb"
path = "src/bin/merge_kb.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "semantic"
required-features = ["embeddings"]

[[example]]
name = "semantic_quality"
required-features = ["local-embeddings"]

[[example]]
name = "embedding_benchmark"
required-features = ["embeddings"]

[[example]]
name = "hybrid"
required-features = ["hybrid"]

[[example]]
name = "hybrid_quality"
required-features = ["hybrid", "local-embeddings"]

[[example]]
name = "hybrid_benchmark"
required-features = ["hybrid"]

[[example]]
name = "graph"
required-features = ["graph"]

[[example]]
name = "graph_benchmark"
required-features = ["graph"]

[[example]]
name = "context"
required-features = ["context-assembly"]

[[example]]
name = "context_benchmark"
required-features = ["context-assembly"]

[[example]]
name = "provenance"
required-features = ["provenance"]

[[example]]
name = "provenance_context"
required-features = ["provenance", "context-assembly"]

[[example]]
name = "provenance_benchmark"
required-features = ["provenance"]

[[example]]
name = "cache"
required-features = ["cache"]

[[example]]
name = "cache_benchmark"
required-features = ["cache"]

[[example]]
name = "ann"
required-features = ["hnsw"]

[[example]]
name = "ann_benchmark"
required-features = ["hnsw"]

[[example]]
name = "versioning"
required-features = ["versioning"]

[[example]]
name = "versioning_benchmark"
required-features = ["versioning"]

[[example]]
name = "quality"
required-features = ["quality"]

[[example]]
name = "retrieval_quality"
required-features = ["quality", "hybrid"]

[[example]]
name = "quality_benchmark"
required-features = ["quality", "context-assembly", "provenance"]

[[example]]
name = "knowledge_pipeline"
required-features = ["hnsw", "cache", "context-assembly", "provenance", "quality"]
