[package]
name = "airust"
version = "0.6.0"
default-run = "airust"
authors = ["LEVOGNE"]
edition = "2021"
rust-version = "1.89"
description = "A modular Rust knowledge engine: lexical search, text matching, optional semantic retrieval and reranking"
license = "MIT"
readme = "README.md"
keywords = ["search", "knowledge", "matching", "retrieval", "reranking"]
categories = ["text-processing", "algorithms"]
documentation = "https://docs.rs/airust"
repository = "https://github.com/LEVOGNE/airust"
include = ["/Cargo.toml", "/Cargo.lock", "src/**", "/build.rs", "knowledge/train.json", "data/pdf/sample.pdf", "examples/**", "scripts/**", "tests/**", "docs/**", "/README.md", "/STARTUP.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/AGENTS.md", "/ROADMAP.md", "/LICENSE", "/test.sh", "/Dockerfile", "/.dockerignore", "!**/.DS_Store", "!**/._*", "!local-lab/**", "!docs/measurements/**/*.json"]
 
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
strsim = "0.10"
chrono = { version = "0.4", optional = true }
thiserror = "1.0"
unicode-normalization = "0.1"
regex = "1.5"
tokio-util = { version = "0.7.20", optional = true, features = ["rt"] }
rmcp = { version = "=3.11.0", optional = true, default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.0", features = ["full"], optional = true }
pdf_oxide = { package = "airust-pdf-backend", version = "=0.3.5", path = "crates/airust-pdf-backend", optional = true }
axum = { version = "0.7", features = ["multipart", "ws"], optional = true }
rusqlite = { version = "0.43", features = ["bundled"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
scraper = { version = "0.29", optional = true }
sha2 = { version = "0.10", optional = true }
url = { version = "2.5.9", optional = true }
tempfile = { version = "3", optional = true }
fastembed = { version = "=7.7.1", optional = true, default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic"] }
petgraph = { version = "0.8.3", optional = true, default-features = false, features = ["std", "stable_graph"] }
postcard = { version = "1.1.3", optional = true, default-features = false, features = ["use-std"] }

hnsw_rs = { version = "=0.3.5", optional = true, default-features = false }

unicode-segmentation = { version = "=1.13.3", optional = true }
rust-stemmers = { version = "=1.2.0", optional = true }

getrandom = { version = "=0.4.3", optional = true }

[features]
pilot = ["mcp", "hybrid", "reranking", "dep:reqwest", "reqwest/blocking"]
default = []
mcp = ["documents", "retrieval", "execution", "dep:tokio", "dep:rmcp", "dep:tokio-util"]
documents = ["provenance", "dep:sha2"]
disk-index = ["sqlite-storage", "retrieval", "rusqlite/hooks"]
training-pipeline = ["feedback", "learned-ranking", "quality-gates"]
rank-explanations = ["learned-ranking", "feedback"]
evidence-freshness = ["reasoning"]
quality-gates = ["quality", "dep:sha2"]
reasoning = ["dep:sha2"]
learned-ranking = ["reranking", "dep:sha2", "serde_json/float_roundtrip"]
feedback = ["reranking","dep:sha2"]
adaptive = ["retrieval"]
shared-index = []
execution = []
snapshots = ["storage", "embeddings", "provenance"]
retrieval = ["dep:unicode-segmentation"]
storage = ["dep:getrandom"]
sqlite-storage = ["storage", "dep:rusqlite"]
advanced-search = ["dep:unicode-segmentation", "dep:rust-stemmers"]
embeddings = []
hnsw = ["embeddings", "dep:hnsw_rs", "serde/rc"]
hybrid = ["embeddings"]
graph = ["dep:petgraph", "serde/rc"]
context-assembly = ["hybrid", "graph"]
provenance = []
versioning = ["serde/rc"]
quality = []
reranking = []
local-reranking = ["reranking", "dep:fastembed", "dep:ort", "dep:sha2"]
cache = ["dep:postcard", "dep:sha2"]
local-embeddings = ["embeddings", "dep:fastembed", "dep:ort", "dep:sha2"]
cli = ["embedded-knowledge", "dep:tempfile"]
pdf = ["dep:pdf_oxide"]
embedded-knowledge = []
colors = []
plotting = []
async = ["dep:tokio"]
bots = ["web"]
web = ["cli", "pdf", "dep:chrono", "dep:axum", "dep:tokio", "dep:rusqlite", "dep:reqwest", "dep:scraper", "dep:sha2", "dep:url", "dep:tempfile"]

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "=0.62.0", default-features = false }
sha2 = "0.10"

[lib]
name = "airust"
path = "src/lib.rs"

[[bin]]
name = "airust"
path = "src/bin/airust.rs"
required-features = ["cli"]


[[bin]]
name = "pdf2kb"
path = "src/bin/pdf2kb.rs"
required-features = ["cli", "pdf"]

[[bin]]
name = "merge_kb"
path = "src/bin/merge_kb.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

